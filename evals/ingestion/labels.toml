# Ingestion benchmark labels: what a good extraction of each page must contain.
#
# Facts were written from rendered page images and slide pictures, BEFORE running any
# engine on these pages, so they aren't tuned to one parser's output.
#
# Each fact is a list of accepted spellings; matching any one counts. Before comparing, both
# the fact and the extracted text are normalized (lowercase, no whitespace, no LaTeX braces
# or sub/superscript marks, Unicode math symbols spelled as LaTeX names), so
# "P(w_{k}|w_{k-1})" and "P(wk|wk−1)" are the same fact.
#
# A fact only counts when found on the labeled page, so a parser that mixes up page
# numbers is penalized. Course files are git-ignored and matched by SHA-256, so these labels
# refuse to apply to a different version of a file.
#
# kind: text (plain text layer) | table | formula (drawn as vector graphics) | diagram (image)

[[files]]
name = "Midterm Review Fall 2026.pdf"
sha256 = "473c30d933443bcc786aa52c435ceb0e5c256a710315eebfca79fe4e8ca6e46c"

[[files]]
name = "AWS-VPC-VPN-EC2-Architecture.pptx"
