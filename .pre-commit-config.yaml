repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-anthropic-keys
        name: Block Anthropic API keys
        language: pygrep
        entry: "sk-ant-[A-Za-z0-9_-]{20,}"
      - id: no-course-files
        name: Block course files (keep them in data/private/)
        language: fail
        entry: "Course material is copyrighted; keep it in data/private/ (git-ignored)."
        files: '\.(pdf|pptx?|docx?)$'
        exclude: '^tests/fixtures/'
