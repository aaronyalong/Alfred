[project]
name = "alfred"
version = "0.1.0"
description = "Turn course materials into verified, source-cited practice questions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
alfred = "alfred.cli:main"

[project.optional-dependencies]
docling = [
    "docling>=2.142.0",
    # Listed directly (docling already depends on them) so that [tool.uv.sources] applies:
    # uv only honors sources for direct dependencies.
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pre-commit>=4.3",
    "pyright>=1.1.405",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# docling needs PyTorch. The default Linux wheels bundle NVIDIA CUDA libraries (several GB);
# the CPU-only build is enough here, so torch and torchvision come from PyTorch's CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only packages listed in [tool.uv.sources] use this index

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
    "RUF", # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
