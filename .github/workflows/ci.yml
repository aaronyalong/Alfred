name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alfred
          POSTGRES_PASSWORD: alfred
          POSTGRES_DB: alfred_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfred" --health-interval 2s
          --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Re-runs the local hooks so they can't be skipped with --no-verify.
      - name: Pre-commit hooks (lint, format, secret and course-file checks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

      # The web tests ran on SQLite above. Postgres is what production uses, and only it can
      # show that two workers never take the same job.
      - name: Web tests on Postgres
        run: uv run pytest tests/web
        env:
          ALFRED_TEST_DATABASE_URL: postgresql+psycopg://alfred:alfred@localhost:5432/alfred_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      # The frontend's API types are generated from the backend. If the API changed and
      # they weren't regenerated, this fails instead of the app breaking at runtime.
      - name: API types are up to date
        run: |
          uv sync --locked
          npm run api:types
          git diff --exit-code src/api/schema.d.ts

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image is what gets deployed, so a change that breaks its build fails here.
      - name: Build the Docker image
        run: docker build .
