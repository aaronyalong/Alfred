name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Re-runs the local hooks so they can't be skipped with --no-verify.
      - name: Pre-commit hooks (lint, format, secret and course-file checks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest
